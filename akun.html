
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Akun TemanTumbuh</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 24px;
      font-family: Arial, sans-serif;
      background: #f5f0ff; color: #403653;
    }
    main {
      max-width: 520px; margin: 30px auto;
      background: white; padding: 25px;
      border-radius: 20px;
      box-shadow: 0 5px 20px #00000010;
    }
    h1 { color: #8064a9; text-align: center; }
    p { line-height: 1.5; }
    input, select, button {
      width: 100%; padding: 12px; margin: 7px 0;
      border-radius: 10px; border: 1px solid #d8cce8;
      font-size: 16px;
    }
    button {
      background: #9278b7; color: white;
      border: 0; cursor: pointer;
    }
    .panel {
      background: #f8f4ff; padding: 15px;
      border-radius: 12px; margin-top: 15px;
    }
    .hidden { display: none; }
    .code { font-size: 24px; font-weight: bold; color: #7656a3; }
  </style>
</head>
<body>
<main>
  <h1>🌱 TemanTumbuh</h1>
  <p style="text-align:center">Tumbuh Teratur, Belajar Lebih Baik.</p>

  <section id="daftar">
    <h3>Masuk / Daftar Prototipe</h3>
    <input id="nama" placeholder="Nama kamu">
    <select id="peran">
      <option value="siswa">Saya Siswa</option>
      <option value="guru">Saya Guru BK</option>
    </select>
    <input id="pin" placeholder="PIN sederhana (untuk demo)" type="password">
    <input id="kode" placeholder="Kode undangan guru (khusus siswa)">
    <button onclick="buatAkun()">Lanjutkan</button>
    <p id="pesan"></p>
  </section>

  <section id="dashboard" class="hidden">
    <h3 id="salam"></h3>
    <div id="isi"></div>
    <button onclick="keluar()">Keluar</button>
  </section>
</main>

<script>
const ambil = (key, fallback) =>
  JSON.parse(localStorage.getItem(key) || JSON.stringify(fallback));

const simpan = (key, value) =>
  localStorage.setItem(key, JSON.stringify(value));

function buatAkun() {
  const nama = document.getElementById("nama").value.trim();
  const peran = document.getElementById("peran").value;
  const pin = document.getElementById("pin").value.trim();
  const kode = document.getElementById("kode").value.trim().toUpperCase();
  const pesan = document.getElementById("pesan");

  if (!nama || !pin) {
    pesan.textContent = "Isi nama dan PIN terlebih dahulu.";
    return;
  }

  let akun = ambil("temantumbuhAkun", []);

  if (akun.some(a => a.nama.toLowerCase() === nama.toLowerCase())) {
    pesan.textContent = "Nama sudah digunakan pada perangkat ini.";
    return;
  }

  let guru = null;
  if (peran === "siswa") {
    guru = akun.find(a => a.peran === "guru" && a.kode === kode);
    if (!guru) {
      pesan.textContent = "Kode guru tidak ditemukan pada perangkat ini.";
      return;
    }
  }

  const data = {
    id: Date.now(),
    nama, peran, pin,
    guruId: guru ? guru.id : null,
    kode: peran === "guru"
      ? "TT" + Math.random().toString(36).slice(2, 7).toUpperCase()
      : null
  };

  akun.push(data);
  simpan("temantumbuhAkun", akun);
  simpan("temantumbuhSesi", data.id);
  tampilkan(data);
}

function tampilkan(user) {
  document.getElementById("daftar").classList.add("hidden");
  document.getElementById("dashboard").classList.remove("hidden");
  document.getElementById("salam").textContent =
    "Halo, " + user.nama + "!";

  const isi = document.getElementById("isi");

  if (user.peran === "guru") {
    const siswa = ambil("temantumbuhAkun", [])
      .filter(a => a.peran === "siswa" && a.guruId === user.id);

    isi.innerHTML = `
      <div class="panel">
        <p>Kode undangan siswa:</p>
        <div class="code">${user.kode}</div>
        <p>Bagikan kode ini kepada siswa.</p>
      </div>
      <div class="panel">
        <h3>Daftar siswa yang bergabung</h3>
        ${siswa.length
          ? siswa.map(s => "<p>👤 " + aman(s.nama) + "</p>").join("")
          : "<p>Belum ada siswa yang bergabung.</p>"}
      </div>`;
  } else {
    const guru = ambil("temantumbuhAkun", [])
      .find(a => a.id === user.guruId);
    isi.innerHTML = `
      <div class="panel">
        <h3>Akun Siswa</h3>
        <p>Kamu terhubung dengan guru BK:
        <b>${guru ? aman(guru.nama) : "-"}</b></p>
        <p>Selamat belajar bersama TemanTumbuh 🌱</p>
      </div>`;
  }
}

function aman(teks) {
  return String(teks).replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;",
    '"':"&quot;", "'":"&#39;"
  }[c]));
}

function keluar() {
  localStorage.removeItem("temantumbuhSesi");
  location.reload();
}

const sesi = ambil("temantumbuhSesi", null);
if (sesi) {
  const user = ambil("temantumbuhAkun", [])
    .find(a => a.id === sesi);
  if (user) tampilkan(user);
}
</script>
</body>
</html>
